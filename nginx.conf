server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets directly (no SPA fallback)
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|eot|pdf)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  # Next.js build assets
  location /_next/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
