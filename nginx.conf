# ==========================================
# 1. بلاک مربوط به سایت اصلی (Next.js)
# ==========================================
server {
  listen 80;
  server_name behradz.ir www.behradz.ir;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static assets directly (no SPA fallback)
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|eot|pdf)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  # Next.js build assets
  location /_next/ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# ==========================================
# 2. بلاک مربوط به n8n (رورس پراکسی)
# ==========================================
server {
  listen 80;
  server_name n8n.behradz.ir;

  location / {
    # آدرس لوکال هاست و پورت n8n
    proxy_pass http://n8n:5678;

    # ارسال هدرهای استاندارد به n8n برای شناسایی کلاینت
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------- تنظیمات مهم برای وب‌سوکت (WebSocket) در n8n --------
    # n8n برای کارکرد صحیح اجرای ورک‌فلوها در مرورگر به وب‌سوکت نیاز دارد
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # تنظیمات پیشنهادی خود n8n برای جلوگیری از مشکلات بافرینگ
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
  }
}